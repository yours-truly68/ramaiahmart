services:
  api:
    image: ${API_IMAGE:-ghcr.io/yours-truly68/ramaiahmart-api:latest}
    container_name: ramaiahmart_api
    restart: unless-stopped
    env_file:
      - .env.production
    expose:
      - "8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')\""]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - ramaiahmart_prod_net

  nginx:
    image: nginx:alpine
    container_name: ramaiahmart_nginx
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:80/api/v1/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - ramaiahmart_prod_net

networks:
  ramaiahmart_prod_net:
    driver: bridge
