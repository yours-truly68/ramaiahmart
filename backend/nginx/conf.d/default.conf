upstream backend_api {
    server api:8000;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    listen 8000;
    listen [::]:8000;

    server_name localhost _;

    # Request limits
    client_max_body_size 15M;
    client_body_timeout 30s;
    client_header_timeout 30s;
    proxy_connect_timeout 10s;
    proxy_read_timeout 60s;
    proxy_send_timeout 60s;

    # Forwarded headers
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-ID $request_id;

    # 1. Health check endpoint (exempt from rate limits for monitoring/load balancers)
    location = /api/v1/health {
        proxy_pass http://backend_api;
        access_log off;
    }

    # 2. Sensitive Authentication routes (IP-level rate limiting with campus NAT burst capacity)
    location /api/v1/auth/ {
        limit_req zone=auth_ip_zone burst=20 nodelay;
        limit_conn addr_conn_limit 10;
        limit_req_status 429;

        proxy_pass http://backend_api;
    }

    # 3. General API endpoints (Broad API rate limiting)
    location / {
        limit_req zone=api_zone burst=50 nodelay;
        limit_conn addr_conn_limit 25;
        limit_req_status 429;

        proxy_pass http://backend_api;
    }
}
