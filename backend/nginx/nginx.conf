user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Sanitized logging format - strictly excludes authorization tokens, OTPs, and sensitive request bodies
    log_format sanitized '$remote_addr - $remote_user [$time_local] "$request_method $request_uri $server_protocol" '
                         '$status $body_bytes_sent "$http_referer" "$http_user_agent" '
                         'rt=$request_time req_id="$http_x_request_id"';

    access_log /var/log/nginx/access.log sanitized;

    # Performance
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # Security
    server_tokens off;

    # Network-level connection & rate limiting zones
    # Connection limiting per IP
    limit_conn_zone $binary_remote_addr zone=addr_conn_limit:10m;

    # General API request rate limiting zone (30 requests/sec per IP with burst)
    limit_req_zone $binary_remote_addr zone=api_zone:10m rate=30r/s;

    # Sensitive authentication routes rate limiting zone (15 requests/min per IP with burst)
    limit_req_zone $binary_remote_addr zone=auth_ip_zone:10m rate=15r/m;

    # Include site configurations
    include /etc/nginx/conf.d/*.conf;
}
