name: Production Deployment

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      manual_image_tag:
        description: "Specific Git commit SHA to deploy (leave empty for current HEAD)"
        required: false
        default: ""

permissions:
  contents: read
  packages: write

concurrency:
  group: production-deployment
  cancel-in-progress: false

jobs:
  validate-backend-ci:
    name: Validate Backend CI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ramaiahmart
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          enable-cache: true
          cache-dependency-glob: "backend/uv.lock"

      - name: Install backend dependencies
        run: uv sync --frozen

      - name: Verify Ruff formatting and linting
        run: |
          uv run ruff format --check app tests
          uv run ruff check app tests

      - name: Verify database migrations
        env:
          DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/ramaiahmart
        run: uv run alembic upgrade head

      - name: Run backend tests
        env:
          DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/ramaiahmart
          APP_ENV: testing
          DEBUG: "true"
          JWT_SECRET_KEY: testing-insecure-secret-key-min-32-characters-for-ci
        run: uv run pytest -q

  validate-frontend-ci:
    name: Validate Frontend CI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.18.3
          run_install: false

      - name: Set up Node.js 22 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"
          cache-dependency-path: "frontend/pnpm-lock.yaml"

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint frontend (ESLint)
        run: pnpm run lint

      - name: Typecheck frontend (TypeScript)
        run: pnpm run typecheck

      - name: Build Next.js production bundle
        env:
          NODE_ENV: production
        run: pnpm run build

      - name: Run security & proxy tests
        run: pnpm run test:security

  build-and-push-ghcr:
    name: Build & Push Image to GHCR
    runs-on: ubuntu-latest
    needs: [validate-backend-ci, validate-frontend-ci]
    outputs:
      image_uri: ${{ steps.image-meta.outputs.image_uri }}
      image_tag: ${{ steps.image-meta.outputs.image_tag }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Resolve Image Tag & Names
        id: image-meta
        run: |
          OWNER_LOWER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          TARGET_SHA="${{ github.event.inputs.manual_image_tag || github.sha }}"
          IMAGE_URI="ghcr.io/${OWNER_LOWER}/ramaiahmart-api:${TARGET_SHA}"
          LATEST_URI="ghcr.io/${OWNER_LOWER}/ramaiahmart-api:latest"
          echo "image_uri=${IMAGE_URI}" >> $GITHUB_OUTPUT
          echo "latest_uri=${LATEST_URI}" >> $GITHUB_OUTPUT
          echo "image_tag=${TARGET_SHA}" >> $GITHUB_OUTPUT
          echo "Prepared target image: ${IMAGE_URI}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Authenticate to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push immutable image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ steps.image-meta.outputs.image_uri }}
            ${{ steps.image-meta.outputs.latest_uri }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-ec2:
    name: Deploy Exact Image to AWS EC2
    runs-on: ubuntu-latest
    needs: [build-and-push-ghcr]
    steps:
      - name: Checkout deployment scripts and compose files
        uses: actions/checkout@v4

      - name: Check EC2 Deployment Configuration
        id: check-secrets
        run: |
          if [ -n "${{ secrets.EC2_HOST }}" ] && [ -n "${{ secrets.EC2_SSH_PRIVATE_KEY }}" ]; then
            echo "configured=true" >> $GITHUB_OUTPUT
          else
            echo "configured=false" >> $GITHUB_OUTPUT
            echo "::notice ::EC2 credentials (EC2_HOST / EC2_SSH_PRIVATE_KEY) not set in repository secrets. Skipping live EC2 deployment. GHCR artifact is ready: ${{ needs.build-and-push-ghcr.outputs.image_uri }}"
          fi

      - name: Deploy to EC2 via SSH
        if: steps.check-secrets.outputs.configured == 'true'
        uses: appleboy/ssh-action@v1.2.0
        env:
          TARGET_IMAGE: ${{ needs.build-and-push-ghcr.outputs.image_uri }}
          GH_ACTOR: ${{ github.actor }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER || 'ubuntu' }}
          key: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          port: ${{ secrets.EC2_SSH_PORT || 22 }}
          envs: TARGET_IMAGE,GH_ACTOR,GH_TOKEN
          script: |
            set -euo pipefail
            DEPLOY_DIR="/srv/ramaiahmart"
            
            echo "--> Connecting to EC2 deploy directory at ${DEPLOY_DIR}..."
            mkdir -p "${DEPLOY_DIR}"
            cd "${DEPLOY_DIR}"

            echo "--> Authenticating Docker to GHCR on host..."
            echo "${GH_TOKEN}" | docker login ghcr.io -u "${GH_ACTOR}" --password-stdin

            echo "--> Deploying target image: ${TARGET_IMAGE}..."
            if [ -f "./scripts/deploy_prod.sh" ]; then
              ./scripts/deploy_prod.sh "${TARGET_IMAGE}"
            else
              # Standalone deployment execution when deploy_prod.sh is run inline
              docker pull "${TARGET_IMAGE}"
              
              echo "--> Running Alembic migrations..."
              docker run --rm --env-file .env.production "${TARGET_IMAGE}" alembic upgrade head
              
              if [ -f ".current_image" ]; then
                cp .current_image .previous_image
              fi
              
              echo "--> Starting updated service..."
              API_IMAGE="${TARGET_IMAGE}" docker compose -f docker-compose.prod.yml up -d --remove-orphans api nginx
              
              echo "--> Polling health endpoint..."
              HEALTHY=false
              for i in $(seq 1 10); do
                echo "    Healthcheck attempt $i/10..."
                if curl -fs http://localhost:80/api/v1/health >/dev/null 2>&1; then
                  HEALTHY=true
                  break
                fi
                sleep 3
              done
              
              if [ "$HEALTHY" = true ]; then
                echo "SUCCESS: Deployment healthy."
                echo "${TARGET_IMAGE}" > .current_image
              else
                echo "CRITICAL: Healthcheck failed! Rolling back..."
                if [ -f ".previous_image" ]; then
                  PREV=$(cat .previous_image)
                  API_IMAGE="$PREV" docker compose -f docker-compose.prod.yml up -d --remove-orphans api
                fi
                exit 1
              fi
            fi
