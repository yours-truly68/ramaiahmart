name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend-ci:
    name: Backend Lint, Format & Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ramaiahmart
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          enable-cache: true
          cache-dependency-glob: "backend/uv.lock"

      - name: Install backend dependencies
        run: uv sync --frozen

      - name: Check code formatting (Ruff)
        run: uv run ruff format --check app tests

      - name: Lint codebase (Ruff)
        run: uv run ruff check app tests

      - name: Run database migrations (Alembic)
        env:
          DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/ramaiahmart
        run: uv run alembic upgrade head

      - name: Validate Alembic schema drift
        env:
          DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/ramaiahmart
        run: uv run alembic check

      - name: Run test suite (pytest)
        env:
          DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/ramaiahmart
          APP_ENV: testing
          DEBUG: "true"
          JWT_SECRET_KEY: testing-insecure-secret-key-min-32-characters-for-ci
        run: uv run pytest -v

  frontend-ci:
    name: Frontend Lint, Typecheck & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.18.3
          run_install: false

      - name: Set up Node.js 22 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"
          cache-dependency-path: "frontend/pnpm-lock.yaml"

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint frontend (ESLint)
        run: pnpm run lint

      - name: Typecheck frontend (TypeScript)
        run: pnpm run typecheck

      - name: Build Next.js production bundle
        env:
          NODE_ENV: production
        run: pnpm run build

      - name: Run security & proxy tests
        run: pnpm run test:security

  docker-build-ci:
    name: Docker Image Build Validation
    runs-on: ubuntu-latest
    needs: [backend-ci, frontend-ci]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend production Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false
          tags: ramaiahmart-api:${{ github.sha }}
          load: true

      - name: Sanity check built Docker image
        run: |
          docker run --rm \
            -e DATABASE_URL="postgresql+psycopg://postgres:postgres@localhost:5432/ramaiahmart" \
            -e APP_ENV="testing" \
            ramaiahmart-api:${{ github.sha }} \
            python -c "from app.main import app; print('Production image container verified')"
